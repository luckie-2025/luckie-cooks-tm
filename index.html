<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luckie Cooks™</title>

  <link rel="stylesheet" href="styles/main.css">
</head>

<body>

  <!-- 🌙 HEADER -->
  <header class="top-bar">
    <h1>Luckie Cooks™</h1>
    <p>🌙 AI-powered cooking assistant</p>
  </header>

  <!-- 🔍 SIMPLE SEARCH (optional part of your app) -->
  <section class="search-box">
    <input id="search" placeholder="Search recipes..." />
    <button onclick="alert('Search coming soon 🔥')">Search</button>
  </section>

  <!-- 🧠 AI COOK MODE -->
  <section id="ai-cook" class="ai-box">

    <h2>🧠 AI Cook Mode</h2>

    <textarea 
      id="ai-input" 
      placeholder="Tell me what ingredients you have... (e.g. egg, rice, onion)"
    ></textarea>

    <button onclick="generateRecipe()">
      Generate Recipe
    </button>

    <div id="ai-output"></div>

  </section>

  <!-- 📦 SCRIPTS (VERY IMPORTANT) -->
  <script src="js/app.js"></script>
  <script src="js/ai-cook-mode.js"></script>

</body>
</html>
