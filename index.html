<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luckie Cooks™</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <header class="top-bar">
    <h1>Luckie Cooks™</h1>
    <p>🌙 cooking with calm & creativity</p>
  </header>

  <section class="search-box">
    <input id="search" placeholder="Search recipes or ingredients..." />
    <button onclick="searchRecipes()">Search</button>
  </section>

  <section id="recipes" class="grid"></section>

  <nav class="bottom-nav">
    <button>Home</button>
    <button>AI Cook</button>
    <button>Saved</button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
<section id="ai-cook" class="ai-box">
  <h2>🧠 AI Cook Mode</h2>

  <textarea id="ai-input" placeholder="Tell me what ingredients you have..."></textarea>
  <button onclick="generateRecipe()">Generate Recipe</button>

  <div id="ai-output"></div>
</section>
